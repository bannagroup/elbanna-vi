name: Build Full App APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # التطبيق الكامل: appId=com.elbanna.fleet واسمه «إدارة البنا» (غير تطبيق السائق وتطبيق الطلبات)
      - name: Use full-app Capacitor config
        run: cp capacitor.full.config.ts capacitor.config.ts

      - name: Build web app (full app)
        run: npx vite build --mode production
        env:
          # اختياري: لو عايز تثبّت مشروع Supabase في التطبيق بدل الافتراضي
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform
        run: |
          npx cap add android
          # صلاحية الكاميرا (تصوير فواتير شراء قطع الغيار)
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # رقم الإصدار بيزيد مع كل بناء (عشان التحديث فوق النسخة القديمة يشتغل)
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          npx cap sync android

      # جسر الطباعة: WebView في أندرويد مابيدعمش window.print() ولا فتح نوافذ جديدة،
      # فبنضيف واجهة أصلية (AndroidPrint) بتفتح شاشة الطباعة بتاعة أندرويد (طابعة أو "حفظ كـ PDF")
      - name: Add native print bridge
        continue-on-error: true
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          if [ -z "$MAIN" ]; then echo "::warning::MainActivity.java not found - print bridge skipped"; exit 0; fi
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/^package \(.*\);.*/\1/')
          cat > "$MAIN" <<'JAVA'
          package __PKG__;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            // مرجع قوي لـ WebView الطباعة لحد ما تخلص
            private WebView printWebView;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(new PrintBridge(), "AndroidPrint");
            }

            private PrintAttributes.MediaSize mediaFor(String paper) {
              if ("A5".equals(paper)) return PrintAttributes.MediaSize.ISO_A5;
              if ("A4L".equals(paper)) return PrintAttributes.MediaSize.ISO_A4.asLandscape();
              return PrintAttributes.MediaSize.ISO_A4;
            }

            private void startPrint(WebView view, String title, String paper) {
              PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
              if (pm == null) return;
              String jobName = (title == null || title.trim().isEmpty()) ? "print" : title;
              PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(jobName);
              PrintAttributes attrs = new PrintAttributes.Builder().setMediaSize(mediaFor(paper)).build();
              pm.print(jobName, adapter, attrs);
            }

            public class PrintBridge {
              // طباعة الصفحة الحالية (بتنسيق @media print الموجود: معاينة A5 للفواتير والتقارير)
              @JavascriptInterface
              public void printPage(final String title, final String paper) {
                runOnUiThread(new Runnable() {
                  @Override
                  public void run() {
                    startPrint(getBridge().getWebView(), title, paper);
                  }
                });
              }

              // طباعة مستند HTML مستقل (كشوف A4 وفاتورة الترخيص)
              @JavascriptInterface
              public void print(final String html, final String title, final String paper) {
                runOnUiThread(new Runnable() {
                  @Override
                  public void run() {
                    final WebView w = new WebView(MainActivity.this);
                    printWebView = w;
                    final boolean[] started = new boolean[] { false };
                    w.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                        if (started[0]) return;
                        started[0] = true;
                        startPrint(view, title, paper);
                      }
                    });
                    w.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                  }
                });
              }
            }
          }
          JAVA
          sed -i "s/__PKG__/$PKG/" "$MAIN"

      # مفتاح توقيع ثابت: من غيره GitHub بيولّد مفتاح debug جديد كل مرة فالتحديث فوق نسخة مثبّتة بيفشل
      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/elbanna-full.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elbanna-full-apk
          path: out/elbanna-full.apk
